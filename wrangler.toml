# Default Worker config for y1-theme-upload (bare `npx wrangler deploy` at repo root).
# Kept in sync with cloudflare-worker-upload.toml and workers/theme-upload/wrangler.toml.
#
# workers_dev must stay on: upload.html and the Theme Studio reach this Worker through
# its *.workers.dev hostname. Leaving workers_dev off (or attaching a zone route without
# workers_dev = true) causes Cloudflare 404 / "error code: 1042" before fetch runs.
#
# Note: y1-theme-analytics deploys explicitly via `--config cloudflare-worker-analytics.toml`
# (scripts/deploy-analytics-worker.mjs) and does not use this root config.

name = "y1-theme-upload"
main = "upload-worker.js"
compatibility_date = "2026-05-11"
workers_dev = true
preview_urls = true
