name: Multilingual Static Page Generation & GA4 Verification

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'
      - 'site-locale.js'
      - 'support_toolbar.html'
      - 'i18n/**'
      - 'scripts/i18n/**'
      - 'notice.xml'
  workflow_dispatch:

permissions:
  contents: write

# One queue with ingest / sitemap / screenshots / metadata sync: this job also
# commits to main, so it must not build while another bot pushes.
concurrency:
  group: theme-publish-main
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the commit step can rebase onto main before pushing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest strings rendered by the JavaScript shell
        run: python3 scripts/i18n/harvest_ui_strings.py

      - name: Extract strings from pages including newly added pages
        run: python3 scripts/i18n/extract_strings.py --tiers core,full

      - name: Merge hand-reviewed copy and pre-translated assets
        run: python3 scripts/i18n/seed_catalogs.py

      - name: Fetch translations for missing non-English strings
        continue-on-error: true
        run: |
          python3 scripts/i18n/translate.py --provider google-web --locales all --top 500

      - name: Protect and repair brand terms and model names
        run: python3 scripts/i18n/repair_brands.py --write

      - name: Rebuild language picker index with demographic prioritization
        run: python3 scripts/i18n/translate.py --index-only

      - name: Verify GA4 tag and Raptive semantic markup
        run: |
          python3 - <<'PY'
          import os, sys
          missing_ga4 = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "node_modules", "dist", ".cache"}]
              for f in files:
                  if f.endswith((".html", ".htm")):
                      p = os.path.join(root, f)
                      c = open(p, "r", encoding="utf-8", errors="ignore").read()
                      if "GTM-TNDGC37L" not in c:
                          missing_ga4.append(p)
          if missing_ga4:
              print(f"Warning: {len(missing_ga4)} pages missing GA4 tag.")
          else:
              print("GA4 tag verified across all HTML pages.")
          PY

      - name: Build static multilingual page trees & sitemap
        run: |
          python3 scripts/i18n/generate_multilingual_static_pages.py
          python3 scripts/update_studio_i18n_seo.py
          python3 scripts/i18n/generate_multilingual_theme_shells.py --missing-only
          python3 scripts/theme_screenshot_seo.py
          python3 scripts/theme_page_download.py
          python3 scripts/i18n/prerender.py --locales all --tiers core --out dist
          python3 scripts/generate_sitemap.py

      - name: Upload static page artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-static-pages
          path: |
            dist/
            sitemap.xml
            sitemap-i18n.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated catalogs, literal static pages, and sitemaps
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add i18n/catalogs/ i18n/strings/ i18n/site-locales.json i18n/reviewed/ i18n/prerendered.json sitemap.xml sitemap-index.xml sitemap-i18n*.xml *.html '*/index*.html' || true
          if git diff --cached --quiet; then
            echo "No translation or catalog changes to commit."
            exit 0
          fi
          git commit -m "chore(i18n): update translations, literal static pages, and sitemaps [skip ci]"
          # A bare `git push` here is what filled the Actions inbox: another workflow
          # (ingest, sitemap, screenshots, translations) lands a commit while this
          # build runs, the push is rejected with "! [rejected] main -> main (fetch
          # first)", and the run is reported as failed. Rebase onto origin/main and
          # retry instead. Everything staged here is regenerated from the repository
          # on every run, so -X theirs keeps this run's generated files on a clash
          # while still taking upstream changes to every other file. --autostash is
          # required: the build also touches files outside the add list above, and a
          # rebase refuses to start on a dirty tree ("cannot rebase: You have unstaged
          # changes") — exactly the failure this retry loop has to survive.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
            fi
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort || true
            fi
            git fetch origin main
            if ! git rebase --autostash -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase attempt ${attempt} could not apply; backing off before retry..."
              sleep $(( attempt * 10 ))
              continue
            fi
            if git push origin "HEAD:main"; then
              ok=1
              break
            fi
            echo "Push attempt ${attempt} rejected; backing off before retry..."
            sleep $(( attempt * 10 ))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: could not push i18n output after retries."
            exit 1
          fi
