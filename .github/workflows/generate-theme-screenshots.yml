name: Generate theme screenshot previews

# Renders each theme's home screen once, in headless Chromium, and commits it as
# screenshot_preview.jpg (480x360, compressed JPEG) inside the theme folder.
# The gallery then shows that file instead of mounting the live simulator, so the
# grid paints without loading theme configs, fonts, wallpapers or icons.
#
# Runs after any upload lands on main (direct-file PRs and extracted ZIPs both add
# config.json), so new themes get a capture without a human step. The commit only
# touches .jpg files (plus themes.json), which does not match the push paths below,
# so this workflow cannot loop on its own commit.
on:
  push:
    branches: [main]
    paths:
      - "*/config.json"
      - "*/Variants/**/config.json"
      - "screenshot.html"
      - "y1-theme-preview.js"
      - "y1-theme-preview.css"
      - "scripts/generate_theme_screenshots.py"
      - ".github/workflows/generate-theme-screenshots.yml"
  schedule:
    # Catch-up sweep for themes edited without touching config.json.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      folder:
        description: Limit to one theme folder (blank = every stale theme)
        required: false
        default: ""
      force:
        description: Re-render even when a capture exists
        type: boolean
        required: false
        default: false

# Same queue as theme ingest / sitemap so two bots never push to main at once.
concurrency:
  group: theme-publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow and Playwright
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Render missing captures
        env:
          SCREENSHOT_FOLDER: ${{ github.event.inputs.folder }}
          SCREENSHOT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          ARGS=(--only-missing --write-metadata)
          if [[ -n "${SCREENSHOT_FOLDER:-}" ]]; then
            ARGS+=(--folder "${SCREENSHOT_FOLDER}")
          fi
          if [[ "${SCREENSHOT_FORCE:-false}" == "true" ]]; then
            ARGS+=(--force)
          fi
          python scripts/generate_theme_screenshots.py "${ARGS[@]}"

      - name: Commit and push captures
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ 2>/dev/null || true
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No screenshot preview changes."
            exit 0
          fi
          git add -A
          git commit -m "Theme previews: add pre-rendered 480x360 screenshot captures"
          ok=0
          for attempt in 1 2 3 4 5; do
            if [[ -d .git/rebase-merge ]] || [[ -d .git/rebase-apply ]]; then
              git rebase --abort || true
            fi
            if [[ -f .git/MERGE_HEAD ]]; then
              git merge --abort || true
            fi
            git fetch origin main
            if ! git pull --rebase origin main; then
              echo "Rebase conflict or pull failed (attempt ${attempt}); skipping this run so the next one can retry cleanly."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:main"; then
              ok=1
              break
            fi
            echo "Push attempt ${attempt} failed; backing off..."
            sleep $(( attempt * 15 ))
          done
          if [[ "$ok" != "1" ]]; then
            echo "ERROR: could not push screenshot captures after retries."
            exit 1
          fi
