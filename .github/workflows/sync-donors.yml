name: Sync donors.csv and notice.xml from Innioasis-Updater

# donors.csv and notice.xml are owned canonically by the Updater repository
# (innioasis.app / y1-community/Innioasis-Updater).
#
# This workflow ensures that InnioasisY1Themes always maintains an exact copy
# of both files so that theme gallery visitors see the latest notices and
# donations.
#
# It pulls from multiple redundant sources (GitHub raw, live innioasis.app,
# and GitHub REST API), validates file structures, normalises line endings to LF,
# and automatically merges updates directly to main without manual intervention.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync check"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - sync-assets
      - upstream-update
      - donors-updated
      - notice-updated
      - sync-donors
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-donors.yml
      - scripts/sync_upstream_assets.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-asset-sync
  cancel-in-progress: false

jobs:
  sync:
    # Do not trigger when the bot commits
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Themes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate canonical assets
        id: sync_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_upstream_assets.py --update-catalogs --output-github-env

      - name: Commit and merge changes automatically
        if: steps.sync_step.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all synced files and updated translations
          git add donors.csv notice.xml i18n/catalogs/ i18n/strings/

          if git diff --cached --quiet; then
            echo "No file changes staged to commit."
            exit 0
          fi

          COMMIT_MSG="Sync donors.csv and notice.xml from Innioasis-Updater [skip ci]"
          git commit -m "$COMMIT_MSG"

          # Attempt direct push first
          if git push origin main; then
            echo "Successfully pushed updates directly to main."
          else
            echo "Direct push failed or branch protected. Creating automated PR with auto-merge..."
            BRANCH="automation/sync-upstream-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"

            PR_URL=$(gh pr create \
              --title "Sync donors.csv and notice.xml from Innioasis-Updater" \
              --body "Automated synchronization of \`donors.csv\` and \`notice.xml\` from canonical Innioasis-Updater sources.\n\nMerged automatically." \
              --base main \
              --head "$BRANCH")
            echo "Opened PR: $PR_URL"

            # Auto-merge the pull request
            gh pr merge "$PR_URL" --auto --squash --delete-branch || \
              gh pr merge "$PR_URL" --squash --delete-branch --admin || \
              gh pr merge "$PR_URL" --squash --delete-branch
            echo "PR merged automatically."
          fi

      - name: Report sync status
        run: |
          {
            echo "### Upstream Asset Sync Status"
            echo
            echo "- **Has changes:** \`${{ steps.sync_step.outputs.has_changes }}\`"
            echo "- **Changed assets:** \`${{ steps.sync_step.outputs.changed_assets || 'none' }}\`"
            echo "- **Sync source:** Canonical Innioasis-Updater (GitHub API / raw / innioasis.app)"
          } >> "$GITHUB_STEP_SUMMARY"
