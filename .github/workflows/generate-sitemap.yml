name: Generate Sitemap

# Theme ingest no longer commits sitemap.xml (avoids huge rebases when uploads
# overlap). The generator walks every theme folder, so a new theme page must be
# listed even when its metadata lands in a separate commit — hence the push
# trigger as well as the schedule.
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "themes.json"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/generate-sitemap.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Same queue as theme ingest / manual metadata sync so two bots never push to main at once (rebase races).
concurrency:
  group: theme-publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Keep each theme page at its own address
        run: python scripts/repair_theme_shells.py

      - name: Generate sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Verify the result
        run: |
          rm -rf scripts/__pycache__ 2>/dev/null || true
          python scripts/generate_sitemap.py --check
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          for path in sorted(pathlib.Path(".").glob("sitemap*.xml")):
              root = ET.parse(path).getroot()
              if root.tag == ns + "sitemapindex":
                  print(f"{path.name}: index with {len(root.findall(ns + 'sitemap'))} sitemaps")
                  continue
              urls = root.findall(ns + "url")
              print(f"{path.name}: {len(urls)} URLs")
              assert len(urls) <= 50000, f"{path.name} exceeds the 50,000 URL limit"
          PY

      - name: Commit and push sitemap updates
        run: |
          set -e
          rm -rf scripts/__pycache__ 2>/dev/null || true
          git add sitemap.xml sitemap-index.xml sitemap-i18n*.xml
          git add -u -- '*.html'
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No sitemap changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sitemaps): refresh theme and locale pages"
          BRANCH="${GITHUB_REF_NAME:-main}"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
            fi
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort || true
            fi
            git fetch origin "${BRANCH}"
            if ! git pull --rebase origin "${BRANCH}"; then
              UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if echo "${UNMERGED}" | grep -qE '(^|/)sitemap(-[a-z0-9-]+)?\.xml$'; then
                python scripts/generate_sitemap.py
                git add sitemap.xml sitemap-index.xml sitemap-i18n*.xml || true
              fi
              if echo "${UNMERGED}" | grep -qE '\.pyc$|__pycache__'; then
                git rm -rf --cached scripts/__pycache__ 2>/dev/null || true
                rm -rf scripts/__pycache__ 2>/dev/null || true
                git add -u || true
              fi
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              fi
            fi
            if git push origin "HEAD:${BRANCH}"; then
              ok=1
              break
            fi
            echo "Rebase/push attempt ${attempt} failed; backing off before retry..."
            sleep $(( attempt * 10 ))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: could not push sitemap after retries."
            exit 1
          fi
