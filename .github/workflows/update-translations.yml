name: Update site translations

# Keeps the Themes Gallery's chrome and hand-written pages translated in every
# language, on the same catalog format as innioasis.app so the two sites can
# share reviewed copy.
#
# Theme submissions themselves are not translated: a theme's name and its
# creator's description are the creator's words, and running them through a
# translator would misrepresent them. The gallery around them — navigation,
# filters, install instructions, safety copy, dock and language picker — is.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "site-locale.js"
      - "site-init.js"
      - "nav.js"
      - "gallery-chrome.js"
      - "support_toolbar.html"
      - "notice.xml"
      - "i18n/**"
      - "scripts/i18n/**"
      - ".github/workflows/update-translations.yml"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      locales:
        description: "'all', 'core', or a comma-separated list (de,fr,ja)"
        default: "all"
      top:
        description: "Only the N most-used strings (0 = every missing string)"
        default: "0"
  repository_dispatch:
    types: [theme-published]

permissions:
  contents: write

concurrency:
  group: update-translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit step can rebase onto main before pushing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest strings rendered by the gallery shell
        run: python3 scripts/i18n/harvest_ui_strings.py

      - name: Extract the gallery pages
        run: python3 scripts/i18n/extract_strings.py --tiers core,full

      - name: Merge hand-reviewed copy
        run: python3 scripts/i18n/seed_catalogs.py

      - name: Translate strings that are still missing
        continue-on-error: true
        env:
          LOCALES: ${{ github.event.inputs.locales || 'all' }}
          TOP: ${{ github.event.inputs.top || '0' }}
        run: |
          ARGS=""
          if [ "$TOP" != "0" ]; then ARGS="--top $TOP"; fi
          python3 scripts/i18n/translate.py --provider google-web --locales "$LOCALES" $ARGS

      - name: Keep brand and model names as written
        run: python3 scripts/i18n/repair_brands.py --write

      - name: Rebuild the language picker index
        run: python3 scripts/i18n/translate.py --index-only

      - name: Report coverage
        continue-on-error: true
        run: |
          python3 scripts/i18n/translate.py --check > coverage.txt || true
          {
            echo "### Translation coverage"
            echo
            echo '```'
            head -1 coverage.txt
            tail -3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 75 pages (y2-themes*, install-themes, studio-test, donate, leaving, ...) had
      # drifted without the GTM snippet, so a check-only step failed the whole job on
      # every run and nothing ever repaired them. check_ga.py already ships a --fix
      # mode that inserts the tag; run it first, then verify. The commit step below
      # stages *.html, so the repaired pages ride along with the translation commit.
      - name: Verify the analytics tag on every page
        run: |
          python3 scripts/i18n/check_ga.py --fix
          python3 scripts/i18n/check_ga.py --check

      # Raptive / AdSense (future): set RAPTIVE_SITE_ID and the ad loader in
      # site-ads.js reads it at runtime. No ad request is made until it is set.
      - name: Generate literal static language pages & pre-render copies
        continue-on-error: true
        run: |
          python3 scripts/i18n/generate_multilingual_static_pages.py
          python3 scripts/generate_sitemap.py
          python3 scripts/i18n/prerender.py --locales all --tiers core,full --out dist

      - name: Upload the pre-rendered gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themes-i18n-site
          path: |
            dist/
            sitemap.xml
            sitemap-i18n.xml
            coverage.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated catalogs, literal static pages, and sitemaps
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/catalogs i18n/strings i18n/site-locales.json i18n/reviewed i18n/prerendered.json sitemap.xml sitemap-i18n.xml *.html || true
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          # [skip ci]: this commit rewrites *.html, which is one of this workflow's own
          # trigger paths. Without it the commit started another full translation run
          # that raced the first one to main. The output is already generated here, so
          # there is nothing for a follow-up run to do.
          git commit -m "Update gallery translations and literal static language pages across supported languages [skip ci]"
          # Same rebase-and-retry push as generate-i18n-pages.yml: a concurrent push to
          # main used to reject this one and report the run as failed. --autostash keeps
          # the rebase working when the build leaves files outside the add list behind.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
            fi
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort || true
            fi
            git fetch origin main
            if ! git rebase --autostash -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase attempt ${attempt} could not apply; backing off before retry..."
              sleep $(( attempt * 10 ))
              continue
            fi
            if git push origin "HEAD:main"; then
              ok=1
              break
            fi
            echo "Push attempt ${attempt} rejected; backing off before retry..."
            sleep $(( attempt * 10 ))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: could not push translation output after retries."
            exit 1
          fi
