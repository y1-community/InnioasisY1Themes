# y1-theme-upload — npx wrangler deploy --config cloudflare-worker-upload.toml
#
# workers_dev must stay on: upload.html and the Studio reach this Worker through
# its *.workers.dev hostname. A deployment that leaves the route off answers
# every request with Cloudflare 404 / "error code: 1042" before the fetch
# handler runs, which reads to the uploader as a dead upload service.

name = "y1-theme-upload"
main = "upload-worker.js"
compatibility_date = "2026-05-11"
workers_dev = true
preview_urls = true
