        function detectLocalCurrency() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                if (tz && TZ_TO_COUNTRY[tz] && COUNTRY_TO_CURRENCY[TZ_TO_COUNTRY[tz]]) {
                    return COUNTRY_TO_CURRENCY[TZ_TO_COUNTRY[tz]];
                }
                if (tz && tz.startsWith('America/')) {
                    const lang = (navigator.language || '');
                    const region = lang.includes('-') ? lang.split('-')[1].toUpperCase() : 'US';
                    if (COUNTRY_TO_CURRENCY[region]) return COUNTRY_TO_CURRENCY[region];
                }
            } catch (e) {}

            const langs = navigator.languages || [navigator.language || 'en-GB'];
            for (const l of langs) {
                const parts = l.split('-');
                if (parts.length > 1) {
                    const region = parts[parts.length - 1].toUpperCase();
                    if (COUNTRY_TO_CURRENCY[region]) {
                        return COUNTRY_TO_CURRENCY[region];
                    }
                }
            }
            return 'GBP';
        }

        async function detectCurrencyAndRate() {
            userCurrency = detectLocalCurrency();

            // Attempt lightweight geo-IP currency detection for accurate visitor country (e.g. UAE, France, UK)
            try {
                const geoRes = await fetch('https://ipapi.co/json/');
                if (geoRes.ok) {
                    const geo = await geoRes.json();
                    if (geo && typeof geo.currency === 'string' && geo.currency.length === 3) {
                        userCurrency = geo.currency.toUpperCase();
                    } else if (geo && geo.country_code && COUNTRY_TO_CURRENCY[geo.country_code]) {
                        userCurrency = COUNTRY_TO_CURRENCY[geo.country_code];
                    }
                }
            } catch (e) {
                // Keep timezone/locale detected currency
            }

            exchangeRate = FALLBACK_RATES[userCurrency] || 0.75;

            if (userCurrency === 'USD') {
                exchangeRate = 1;
                return;
            }

            const endpoints = [
                'https://open.er-api.com/v6/latest/USD',
                `https://api.frankfurter.dev/v1/latest?base=USD&symbols=${encodeURIComponent(userCurrency)}`
            ];
            for (const url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        const rate = data?.rates?.[userCurrency];
                        if (typeof rate === 'number' && rate > 0) {
                            exchangeRate = rate;
                            return;
                        }
                    }
                } catch (e) {
                    // Use next endpoint or fallback rate
                }
            }
        }

        function parseCSVLine(line) {
            const cols = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    cols.push(cur.trim());
                    cur = '';
                } else {
                    cur += c;
                }
            }
            cols.push(cur.trim());
            return cols;
        }

        function toISODate(dateStr) {
            if (!dateStr) return null;
            const s = dateStr.trim();
            const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
            if (dmy) {
                const d = String(parseInt(dmy[1], 10)).padStart(2, '0');
                const m = String(parseInt(dmy[2], 10)).padStart(2, '0');
                let y = parseInt(dmy[3], 10);
                if (y < 100) y += 2000;
                return `${y}-${m}-${d}`;
            }
            const ymd = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
            if (ymd) {
                return `${ymd[1]}-${String(parseInt(ymd[2], 10)).padStart(2, '0')}-${String(parseInt(ymd[3], 10)).padStart(2, '0')}`;
            }
            return null;
        }

        async function loadHistoricalRates(allDateStrings) {
            historicalRates = {};
            if (userCurrency === 'USD') return;

            const isoDates = allDateStrings.map(toISODate).filter(Boolean).sort();
            if (!isoDates.length) return;

            const todayISO = new Date().toISOString().slice(0, 10);
            const minDate = isoDates[0];
            const maxDate = isoDates[isoDates.length - 1] > todayISO ? todayISO : isoDates[isoDates.length - 1];

            if (minDate > todayISO) return;

            try {
                const url = `https://api.frankfurter.dev/v1/${minDate}..${maxDate}?base=USD&symbols=${encodeURIComponent(userCurrency)}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.rates) {
                        for (const [dt, obj] of Object.entries(data.rates)) {
                            if (obj && typeof obj[userCurrency] === 'number') {
                                historicalRates[dt] = obj[userCurrency];
                            }
                        }
                    }
                }
            } catch (e) {
                // Fallback to current/fallback exchangeRate if historical range unavailable
            }
        }

        function getRateForDate(dateStr) {
            if (userCurrency === 'USD') return 1;
            const iso = toISODate(dateStr);
            if (!iso) return exchangeRate;
            if (historicalRates[iso]) return historicalRates[iso];

            // Find closest preceding business day rate in historicalRates
            const availableDates = Object.keys(historicalRates).sort();
            if (!availableDates.length) return exchangeRate;

            let chosen = availableDates[0];
            for (const d of availableDates) {
                if (d <= iso) chosen = d;
                else break;
            }
            return historicalRates[chosen] || exchangeRate;
        }

        function parseDonorsCSV(text) {
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim().length > 0);
            if (!lines.length) return { list: [], innioasisList: [], innioasisSum: 0 };

            const first = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());
            const isDateStr = (s) => /^\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}$/.test((s || '').trim());
            const isAmountStr = (s) => /^[-+]?[$£€]?\s*\d+(\.\d+)?$/.test((s || '').trim());

            const hasHeader = first.some(h =>
                h.includes('name') || h.includes('donor') || h.includes('supporter') ||
                h.includes('amount') || h.includes('contribution') || h.includes('date') ||
                h.includes('platform') || h.includes('method')
            );

            // Detect column indices dynamically from header or first data row
            let nameIdx = -1, amountIdx = -1, dateIdx = -1, platformIdx = -1, messageIdx = -1;

            if (hasHeader) {
                first.forEach((h, idx) => {
                    if (nameIdx === -1 && (h.includes('name') || h.includes('donor') || h.includes('supporter') || h.includes('who') || h.includes('person'))) nameIdx = idx;
                    else if (amountIdx === -1 && (h.includes('amount') || h.includes('contribution') || h.includes('usd') || h.includes('value') || h.includes('total') || h.includes('sum') || h.includes('price') || h.includes('money') || h.includes('donat'))) amountIdx = idx;
                    else if (dateIdx === -1 && (h.includes('date') || h.includes('time') || h.includes('when'))) dateIdx = idx;
                    else if (platformIdx === -1 && (h.includes('platform') || h.includes('method') || h.includes('source') || h.includes('via') || h.includes('service') || h.includes('type'))) platformIdx = idx;
                    else if (messageIdx === -1 && (h.includes('message') || h.includes('note') || h.includes('comment') || h.includes('reason') || h.includes('description'))) messageIdx = idx;
                });
            }

            const start = hasHeader ? 1 : 0;
            const list = [];
            const innioasisList = [];
            let innioasisSum = 0;

            for (let i = start; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                if (cols.length < 2) continue;

                // Find date column for this row if not explicitly matched or if value looks like a date
                let rowDateIdx = (dateIdx !== -1 && isDateStr(cols[dateIdx])) ? dateIdx : cols.findIndex(c => isDateStr(c));

                // Find amount column strictly (never a date string)
                let rowAmountIdx = (amountIdx !== -1 && !isDateStr(cols[amountIdx]) && isAmountStr(cols[amountIdx]))
                    ? amountIdx
                    : cols.findIndex((c, idx) => idx !== rowDateIdx && isAmountStr(c));

                if (rowAmountIdx === -1) continue;

                const rawAmt = cols[rowAmountIdx].trim();
                const amount = parseFloat(rawAmt.replace(/[^0-9.-]/g, ''));
                if (isNaN(amount) || amount === 0) continue;

                const date = rowDateIdx !== -1 ? cols[rowDateIdx].trim() : '';

                // Identify name column (first non-amount, non-date column, or header-matched)
                let rowNameIdx = (nameIdx !== -1 && nameIdx !== rowAmountIdx && nameIdx !== rowDateIdx)
                    ? nameIdx
                    : cols.findIndex((_, idx) => idx !== rowAmountIdx && idx !== rowDateIdx);

                const name = (rowNameIdx !== -1 ? cols[rowNameIdx] : 'Someone').trim() || 'Someone';

                // Remaining columns: platform (short label) & message (longer text)
                const remainingIdxs = cols
                    .map((_, idx) => idx)
                    .filter(idx => idx !== rowNameIdx && idx !== rowAmountIdx && idx !== rowDateIdx);

                let platform = '';
                let message = '';

                if (platformIdx !== -1 && remainingIdxs.includes(platformIdx)) {
                    platform = cols[platformIdx].trim();
                }
                if (messageIdx !== -1 && remainingIdxs.includes(messageIdx)) {
                    message = cols[messageIdx].trim();
                }

                if (!platform && !message) {
                    const nonEmpty = remainingIdxs.map(idx => cols[idx].trim()).filter(Boolean);
                    const knownPlatforms = ['ko-fi', 'kofi', 'paypal', 'patreon', 'revolut', 'bitcoin', 'btc', 'eth', 'boosty', 'sponsorship', 'crypto'];
                    nonEmpty.forEach(val => {
                        if (!platform && (knownPlatforms.some(p => val.toLowerCase().includes(p)) || val.length <= 18)) {
                            platform = val;
                        } else if (!message) {
                            message = val;
                        } else {
                            message += ' ' + val;
                        }
                    });
                }

                // Separate entries where the name is Innioasis
                if (name.toLowerCase() === 'innioasis' || name.toLowerCase().startsWith('innioasis ')) {
                    innioasisSum += amount;
                    innioasisList.push({ amount, date });
                    continue;
                }

                list.push({
                    id: i,
                    name,
                    platform,
                    amount,
                    date,
                    timestamp: parseDateValue(date, i),
                    message
                });
            }

            return {
                list: list.sort((a, b) => b.timestamp - a.timestamp),
                innioasisList,
                innioasisSum
            };
        }

        function parseDateValue(str, orderFallback) {
            if (!str) return 0 - orderFallback;
            const s = str.trim();
            const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
            if (dmy) {
                const d = parseInt(dmy[1], 10);
                const m = parseInt(dmy[2], 10) - 1;
                let y = parseInt(dmy[3], 10);
                if (y < 100) y += 2000;
                return new Date(y, m, d).getTime() - orderFallback;
            }
            const t = Date.parse(s);
            return !isNaN(t) ? (t - orderFallback) : (0 - orderFallback);
        }

        function formatConvertedAmount(converted, showPlus = false) {
            const abs = Math.abs(converted);
            let formatted;
            try {
                formatted = new Intl.NumberFormat(userLocale, {
                    style: 'currency',
                    currency: userCurrency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(abs);
            } catch (e) {
                formatted = `£${abs.toFixed(2)}`;
            }
            if (converted < 0) return `-${formatted}`;
            if (showPlus && converted > 0) return `+${formatted}`;
            return formatted;
        }

        function formatMoney(val, showPlus = false, dateStr = null) {
            const rate = dateStr ? getRateForDate(dateStr) : exchangeRate;
            return formatConvertedAmount(val * rate, showPlus);
        }

        function formatDateHeading(dateStr) {
            if (!dateStr) return 'Earlier';
            const dmy = dateStr.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
            if (dmy) {
                const d = parseInt(dmy[1], 10);
                const m = parseInt(dmy[2], 10) - 1;
                let y = parseInt(dmy[3], 10);
                if (y < 100) y += 2000;
                const dt = new Date(y, m, d);
                return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            }
            return dateStr;
        }

        function getInitials(name) {
            const clean = (name || '?').replace(/[^a-zA-Z0-9 ]/g, '').trim();
            if (!clean) return '?';
            const parts = clean.split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return clean.slice(0, 2).toUpperCase();
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function updateTotals() {
            const netConverted = entries.reduce((sum, e) => sum + (e.amount * getRateForDate(e.date)), 0);
            const innioasisConverted = innioasisEntries.length
                ? innioasisEntries.reduce((sum, e) => sum + (e.amount * getRateForDate(e.date)), 0)
                : innioasisTotal * exchangeRate;

            // Large number always displays total donations received minus total donations paid out (at historical transaction rates)
            document.getElementById('heroAmount').textContent = formatConvertedAmount(netConverted, false);

            document.getElementById('innioasisSubtitle').textContent = `From Innioasis: ${formatConvertedAmount(innioasisConverted, false)}`;
        }

        function renderFeed() {
            updateTotals();

            const container = document.getElementById('feedContainer');
            if (!entries.length) {
                container.innerHTML = `
                    <div class="py-12 text-center text-sm text-slate-400">
                        No transactions found
                    </div>
                `;
                return;
            }

            // Group by date like Monzo transaction feed
            const groups = [];
            const seen = new Map();
            entries.forEach(item => {
                const key = item.date || 'Earlier';
                if (!seen.has(key)) {
                    const g = { date: key, items: [] };
                    seen.set(key, g);
                    groups.push(g);
                }
                seen.get(key).items.push(item);
            });

            container.innerHTML = groups.map(group => `
                <div class="py-2">
                    <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 py-1.5">
                        ${escapeHTML(formatDateHeading(group.date))}
                    </div>
                    <div class="divide-y divide-slate-100">
                        ${group.items.map(item => {
                            const isReceived = item.amount > 0;
                            const amtClass = isReceived ? 'text-emerald-600 font-semibold' : 'text-slate-900 font-medium';
                            const avatarClass = isReceived
                                ? 'bg-emerald-50 text-emerald-700'
                                : 'bg-rose-50 text-rose-600';

                            return `
                                <div class="py-3 flex items-start justify-between gap-3">
                                    <div class="flex items-start gap-3 min-w-0">
                                        <div class="w-9 h-9 rounded-full ${avatarClass} flex items-center justify-center text-xs font-semibold shrink-0 mt-0.5">
                                            ${escapeHTML(getInitials(item.name))}
                                        </div>
                                        <div class="min-w-0">
                                            <div class="text-sm font-medium text-slate-900 truncate">
                                                ${escapeHTML(item.name)}
                                            </div>
                                            ${item.platform ? `
                                                <div class="text-xs text-slate-400">
                                                    ${escapeHTML(item.platform)}
                                                </div>
                                            ` : ''}
                                            ${item.message ? `
                                                <div class="text-xs text-slate-500 mt-1 break-words leading-relaxed">
                                                    ${escapeHTML(item.message)}
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                    <div class="text-sm tabular-nums shrink-0 ${amtClass}">
                                        ${formatMoney(item.amount, true, item.date)}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function loadDonorsCSV() {
            const targetUrl = 'https://innioasis.app/donors.csv?t=' + Date.now();
            const urls = [
                targetUrl,
                'https://innioasis.app/donors.csv',
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl),
                'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://innioasis.app/donors.csv'),
                'https://corsproxy.io/?' + encodeURIComponent(targetUrl)
            ];

            async function fetchLiveCSV() {
                for (const url of urls) {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 6000);
                        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
                        clearTimeout(timer);
                        if (res.ok) {
                            const text = await res.text();
                            const candidate = parseDonorsCSV(text);
                            if (candidate.list.length > 0) {
                                return candidate;
                            }
                        }
                    } catch (e) {
                        // Try next endpoint
                    }
                }
                return null;
            }

            // Fetch live CSV and visitor's currency rate in parallel
            const [liveParsed] = await Promise.all([
                fetchLiveCSV(),
                detectCurrencyAndRate()
            ]);

            const parsed = liveParsed || parseDonorsCSV(FALLBACK_CSV);

            entries = parsed.list;
            innioasisEntries = parsed.innioasisList || [];
            innioasisTotal = parsed.innioasisSum;

            // Render immediately with current exchange rate, then refine with exact historical transaction-date rates
            renderFeed();

            const allDates = [
                ...entries.map(e => e.date),
                ...innioasisEntries.map(e => e.date)
            ].filter(Boolean);

            await loadHistoricalRates(allDates);
            renderFeed();
        }

        window.addEventListener('DOMContentLoaded', loadDonorsCSV);
    </script>
